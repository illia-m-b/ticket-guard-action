---
# yamllint disable rule:line-length
glob_matcher: doublestar
pre-commit:
  commands:
    format-pkg-fix:
      glob: 'package.json'
      run: pnpm format:pkg:fix
      stage_fixed: true
    pnpm-pkg-fix:
      glob: 'package.json'
      run: pnpm pkg fix
      stage_fixed: true
    format-code-fix:
      run: pnpm format:code:fix {staged_files}
      stage_fixed: true
    lint-ts-fix:
      glob: '**/*.{js,ts,cjs,mjs}'
      run: pnpm lint:ts:fix {staged_files}
      stage_fixed: true
pre-push:
  parallel: true
  commands:
    build:
      run: pnpm build
    lint-pkg:
      run: pnpm lint:pkg
    format-pkg-check:
      run: pnpm format:pkg:check
    types-check:
      run: pnpm types:check
    format-code-check:
      run: pnpm format:code:check
    lint-ts-check:
      run: pnpm lint:ts:check
    test:
      run: pnpm test
