---
# yamllint disable rule:line-length
glob_matcher: doublestar
no_tty: true
pre-commit:
  piped: true
  jobs:
    - name: forbid-dist
      glob: 'dist/**'
      run: echo "Do not commit dist/ directly" >&2 && exit 1
    - name: pkg-fix
      glob: package.json
      run: pnpm pkg fix
      stage_fixed: true
    - name: lint
      glob: '**/*.{js,cjs,mjs,ts,cts,mts}'
      run: pnpm lint {staged_files}
      stage_fixed: true
    - name: fmt
      glob: '**/*.{js,cjs,mjs,ts,cts,mts,json,jsonc,json5,toml,yml,yaml,md}'
      run: pnpm fmt {staged_files}
      stage_fixed: true
    - name: yamllint
      glob: '**/*.{yml,yaml}'
      run: pnpm exec yamllint {staged_files}
    - name: lint-md
      glob: '**/*.md'
      run: pnpm lint:md --no-globs {staged_files}
      stage_fixed: true
    - name: lint-md-config
      glob: '**/.markdownlint-cli2.yaml'
      run: pnpm lint:md:ck
    - name: reuse
      run: pnpm exec reuse lint-file {staged_files}
pre-push:
  piped: true
  jobs:
    - name: checks
      group:
        parallel: true
        jobs:
          - name: lint-agents
            run: pnpm lint:agents
          - name: lint-md-ck
            run: pnpm lint:md:ck
          - name: lint-reuse
            run: pnpm lint:reuse
          - name: lint-yaml
            run: pnpm lint:yaml
          - name: fmt-ck
            run: pnpm fmt:ck
          - name: lint-ck
            run: pnpm lint:ck
    - name: verify
      group:
        parallel: true
        jobs:
          - name: build
            run: pnpm build
          - name: test
            run: pnpm test
