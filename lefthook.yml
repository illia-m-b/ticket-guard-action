---
# yamllint disable rule:line-length
glob_matcher: doublestar
no_tty: true
pre-commit:
  piped: true
  jobs:
    - name: pkg-fix
      glob: package.json
      run: pnpm pkg fix
      stage_fixed: true
    - name: lint-ts-fix
      glob:
        - '**/*.{js,ts,cjs,mjs}'
        - package.json
      run: pnpm lint:ts:fix {staged_files}
      stage_fixed: true
    - name: fmt
      glob: '**/*.{js,cjs,mjs,ts,cts,mts,json,jsonc,json5,toml,yml,yaml,md}'
      run: pnpm fmt {staged_files}
      stage_fixed: true
pre-push:
  parallel: true
  commands:
    lint-agents:
      glob: 'AGENTS.md'
      run: pnpm lint:agents
    build:
      run: pnpm build
    types-check:
      run: pnpm types:check
    fmt-check:
      run: pnpm fmt:ck
    lint-ts-check:
      run: pnpm lint:ts:check
    test:
      run: pnpm test
