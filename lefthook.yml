---
# yamllint disable rule:line-length
glob_matcher: doublestar
no_tty: true
pre-commit:
  piped: true
  jobs:
    - name: forbid-dist
      glob: 'dist/**'
      run: echo "Do not commit dist/ directly" >&2 && exit 1
    - name: pkg-fix
      glob: package.json
      run: pnpm pkg fix
      stage_fixed: true
    - name: lint
      glob: '**/*.{js,cjs,mjs,ts,cts,mts}'
      run: pnpm lint {staged_files}
      stage_fixed: true
    - name: fmt
      glob: '**/*.{js,cjs,mjs,ts,cts,mts,json,jsonc,json5,toml,yml,yaml,md}'
      run: pnpm fmt {staged_files}
      stage_fixed: true
pre-push:
  parallel: true
  commands:
    lint-agents:
      run: pnpm lint:agents
    build:
      run: pnpm build
    fmt-ck:
      run: pnpm fmt:ck
    lint-ck:
      run: pnpm lint:ck
    test:
      run: pnpm test
