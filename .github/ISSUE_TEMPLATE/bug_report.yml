---
# yamllint disable rule:line-length
name: Bug Report
description: Report a defect with a minimal reproduction or a test scenario.
title: 'fix: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ### Reproduce Before Fixing
        Review [`CONTRIBUTING.md`][contributing] and search existing issues before opening a defect report.

        [contributing]: https://github.com/illia-m-b/ticket-guard-action/blob/main/CONTRIBUTING.md
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checks
      description: Confirm required preliminary checks.
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I verified the defect reproduces on release v0.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: Concise statement of the defect.
      placeholder: What failed, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: |
        Every defect requires an isolated reproduction or a failing test.
      placeholder: |
        1. Action configuration:
           ```yaml
           - uses: illia-m-b/ticket-guard-action@v0
             with:
               extract-from: pr-title
           ```
        2. Pull request title or input: ...
        3. Observed failure: ...
    validations:
      required: true
  - type: dropdown
    id: runner-os
    attributes:
      label: Runner Operating System
      description: GitHub Actions runner environment.
      options:
        - ubuntu-slim
        - ubuntu-latest / ubuntu-22.04 / ubuntu-24.04 / ubuntu-26.04
        - macos
        - windows
        - Self-hosted
      default: 0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Action Logs
      description: Relevant execution logs.
      render: shell
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Extra context or diagnostic details.
    validations:
      required: false
