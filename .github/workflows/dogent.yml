---
# yamllint disable rule:line-length
name: dogent
'on':
  push: &filter
    branches:
      - main
    paths:
      - AGENTS.md
      - .github/workflows/dogent.yml
  pull_request: *filter
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  dogent:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          sparse-checkout: AGENTS.md
          sparse-checkout-cone-mode: false
      - run: |
          set -euo pipefail
          ARGS=("--hints" "--verbose")
          if [ -z "$OPENAI_API_KEY" ]; then
            ARGS+=("--offline")
          fi
          npm exec --yes --ignore-scripts --no-audit --no-fund \
            --package=@yegor256/dogent@0.13.3 \
            -- dogent "${ARGS[@]}" AGENTS.md
        env:
          OPENAI_BASE_URL: https://api.groq.com/openai/v1
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_MODEL: openai/gpt-oss-120b
