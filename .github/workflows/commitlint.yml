---
# yamllint disable rule:line-length
name: commitlint
'on':
  pull_request:
    branches:
      - main
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  commitlint:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - run: |
          set -euo pipefail
          npm exec --prefix "${RUNNER_TEMP}" \
            --yes \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --package=@commitlint/cli@21.2.4 \
            --package=@commitlint/config-conventional@21.2.4 \
            -- \
            commitlint \
            --default-config \
            --from="${FROM_SHA}" \
            --to="${TO_SHA}" \
            --verbose
        env:
          FROM_SHA: ${{ github.event.pull_request.base.sha }}
          TO_SHA: ${{ github.event.pull_request.head.sha }}
