---
# yamllint disable rule:line-length
name: stryker
'on':
  push: &filter
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'stryker.config.json'
      - 'vitest.config.ts'
      - 'tsconfig.json'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'patches/**'
      - '.github/workflows/stryker.yml'
  pull_request: *filter
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  stryker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
          save-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('src/**', 'test/**', 'stryker.config.json', 'vitest.config.ts', 'tsconfig.json', 'pnpm-lock.yaml', 'package.json', 'patches/**') }}
          restore-keys: |
            stryker-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-
            stryker-${{ runner.os }}-main-
      - run: pnpm stryker run
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
