---
# yamllint disable rule:line-length
name: pnpm
'on':
  push: &filter
    branches:
      - main
  pull_request: *filter
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  pnpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
          show-progress: false
      - if: >
          github.event_name == 'pull_request' &&
          !(
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login == 'illia-m-b-automation[bot]'
          )
        run: git diff --quiet HEAD^1 HEAD -- dist/
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm exec lefthook run pre-push --all-files
