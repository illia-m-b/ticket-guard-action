---
# yamllint disable rule:line-length
name: ticket-guard
'on':
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
jobs:
  ticket-guard:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: illia-m-b/ticket-guard-action@085f3e6433a3ac9de5bd7f94673d068b9466e219 # v0.0.0
        with:
          extract-from: 'pr-body'
          forbidden-labels: |
            invalid
            question
            wontfix
            duplicate
          ignore-actors: |
            renovate[bot]
            illia-m-b-automation[bot]
