---
# yamllint disable rule:line-length
name: yamllint
'on':
  push: &filter
    branches:
      - main
    paths:
      - '**.yml'
      - '**.yaml'
      - '!pnpm-lock.yaml'
      - '.yamlignore'
      - '.gitignore'
  pull_request: *filter
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  yamllint:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - run: pipx run yamllint==1.38.0 -f github .
