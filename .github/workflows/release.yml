---
# yamllint disable rule:line-length
name: release
'on':
  push:
    branches:
      - main
permissions: {}
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release-pr:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  publish:
    needs: release-pr
    if: needs.release-pr.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-pr.outputs.tag_name }}
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
      - env:
          RELEASE_TAG: ${{ needs.release-pr.outputs.tag_name }}
          MAJOR_TAG: v${{ needs.release-pr.outputs.major }}
          MINOR_TAG: v${{ needs.release-pr.outputs.major }}.${{ needs.release-pr.outputs.minor }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          target_sha="$(git rev-parse HEAD)"
          git tag -f -a "${MAJOR_TAG}" -m "Release ${MAJOR_TAG}" "${target_sha}"
          git tag -f -a "${MINOR_TAG}" -m "Release ${MINOR_TAG}" "${target_sha}"
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 --wrap=0)"
          echo "::add-mask::${auth_header}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" push --atomic --force origin \
            "refs/tags/${MAJOR_TAG}" \
            "refs/tags/${MINOR_TAG}"
      - env:
          RELEASE_TAG: ${{ needs.release-pr.outputs.tag_name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release upload "${RELEASE_TAG}" dist/THIRD-PARTY-LICENSES.txt --clobber
