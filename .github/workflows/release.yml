---
# yamllint disable rule:line-length
name: release
'on':
  push:
    branches:
      - main
permissions: {}
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release-pr:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  build:
    needs: release-pr
    if: needs.release-pr.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-pr.outputs.tag_name }}
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - run: |
          rm -rf dist
          pnpm build
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dist-${{ needs.release-pr.outputs.tag_name }}
          path: dist/
          retention-days: 1
  publish:
    needs:
      - release-pr
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-pr.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: dist-${{ needs.release-pr.outputs.tag_name }}
          path: dist
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
      - id: user-id
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      - env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.user-id.outputs.id }}
          RELEASE_TAG: ${{ needs.release-pr.outputs.tag_name }}
          MAJOR_TAG: v${{ needs.release-pr.outputs.major }}
          MINOR_TAG: v${{ needs.release-pr.outputs.major }}.${{ needs.release-pr.outputs.minor }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --local user.name "${APP_SLUG}[bot]"
          git config --local user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add -f dist/
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m "chore(release): build dist for ${RELEASE_TAG}"
          fi
          target_commit="$(git rev-parse HEAD)"
          git tag -f -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}" "${target_commit}"
          git tag -f -a "${MAJOR_TAG}" -m "Release ${MAJOR_TAG}" "${target_commit}"
          git tag -f -a "${MINOR_TAG}" -m "Release ${MINOR_TAG}" "${target_commit}"
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 --wrap=0)"
          echo "::add-mask::${auth_header}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" push --atomic --force origin \
            "refs/tags/${RELEASE_TAG}" \
            "refs/tags/${MAJOR_TAG}" \
            "refs/tags/${MINOR_TAG}"
      - env:
          RELEASE_TAG: ${{ needs.release-pr.outputs.tag_name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release upload "${RELEASE_TAG}" dist/THIRD-PARTY-LICENSES.txt --clobber
          gh release edit "${RELEASE_TAG}" --draft=false --verify-tag
